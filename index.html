<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An interactive map of 95 machine learning concepts, from linear algebra to RLHF and AI agents, linked by their prerequisites.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><title>Machine Learning Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen app. Header + stage rail on top; a zoomable top-to-bottom concept map (foundations → deployment)
   on the left; a reading panel on the right that becomes a bottom sheet on phones. Domains are "transit lines". */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9;
  --ink:#121C27; --ink-2:#4B5968; --ink-3:#7C8896;
  --line:#D3DAE2; --edge:#8D9AA8; --grid:#D2D9E1; --focus:#1F5FD1; --on-c:#FFFFFF;
  --shadow:0 10px 30px rgba(18,28,39,.13);
  --d-math:#3461C9; --d-core:#148A7B; --d-classic:#5B8A17; --d-nn:#C96F0E; --d-arch:#CF3B52;
  --d-gen:#A87700; --d-pre:#7E52C6; --d-post:#BF418E; --d-deploy:#1886B0;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1218; --surface:#151C25; --surface-2:#19212C;
    --ink:#E5EBF1; --ink-2:#A6B2C0; --ink-3:#6E7C8B;
    --line:#29343F; --edge:#4D5B6B; --grid:#1E2732; --focus:#7FA6FF; --on-c:#0D1218;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --d-math:#7C9CF0; --d-core:#3CC3AE; --d-classic:#9CC452; --d-nn:#F0A04A; --d-arch:#F2707F;
    --d-gen:#E3B94A; --d-pre:#B092EE; --d-post:#EC80BF; --d-deploy:#5BC0E6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1218; --surface:#151C25; --surface-2:#19212C;
  --ink:#E5EBF1; --ink-2:#A6B2C0; --ink-3:#6E7C8B;
  --line:#29343F; --edge:#4D5B6B; --grid:#1E2732; --focus:#7FA6FF; --on-c:#0D1218;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --d-math:#7C9CF0; --d-core:#3CC3AE; --d-classic:#9CC452; --d-nn:#F0A04A; --d-arch:#F2707F;
  --d-gen:#E3B94A; --d-pre:#B092EE; --d-post:#EC80BF; --d-deploy:#5BC0E6;
  color-scheme:dark;
}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.55 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr)}

/* header */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{flex:1 1 220px;min-width:0}
.brand h1{margin:0;font:700 23px/1.1 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
.brand p{margin:3px 0 0;color:var(--ink-2);font-size:12.5px;font-variant-numeric:tabular-nums}
.search{position:relative;flex:0 1 300px;min-width:0}
.search input{width:100%;box-sizing:border-box;height:38px;padding:0 12px 0 34px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface-2);color:var(--ink);font:400 14px var(--f-body)}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2;pointer-events:none}
.results{position:absolute;z-index:30;top:calc(100% + 6px);left:0;right:0;margin:0;padding:6px;list-style:none;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:340px;overflow:auto}
.results li button{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;padding:8px 10px;border:0;border-radius:8px;background:none;cursor:pointer}
.results li button .dot{margin-top:6px}
.results li button[aria-selected="true"],.results li button:hover{background:var(--surface-2)}
.results .rt{display:block;font-weight:600;font-size:13.5px}
.results .rs{display:block;color:var(--ink-2);font-size:12px;line-height:1.4}
.results .empty{padding:10px;color:var(--ink-2);font-size:13px}

.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:600 13.5px var(--f-body);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:hover{opacity:.9}
.btn.on{background:var(--surface-2);border-color:var(--ink-2)}
.iconbtn{width:30px;height:30px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:17px;line-height:1;color:var(--ink-2)}
.iconbtn:hover{color:var(--ink);border-color:var(--ink-3)}

/* stage rail */
.rail{display:flex;gap:6px;overflow-x:auto;padding-block:8px;scrollbar-width:thin;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface-2);border-bottom:1px solid var(--line)}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 9px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface);font:500 12.5px var(--f-body);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--c)}
.chip .num{font:500 10.5px var(--f-mono);color:var(--ink-3);letter-spacing:.04em}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}

/* stage */
.stage{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.map{position:relative;min-width:0;min-height:0;overflow:hidden;background-color:var(--bg);
  background-image:radial-gradient(circle,var(--grid) 1.1px,transparent 1.3px);background-size:24px 24px}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#svg:active{cursor:grabbing}
.hint{position:absolute;left:14px;bottom:12px;margin:0;padding:5px 10px;border-radius:8px;background:color-mix(in srgb,var(--surface) 88%,transparent);
  border:1px solid var(--line);color:var(--ink-2);font:400 11.5px var(--f-mono);pointer-events:none}
.zoomctl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoomctl button{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;
  font:500 16px var(--f-mono);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.zoomctl button.fit{font-size:10.5px;letter-spacing:.04em}
.zoomctl button:hover{border-color:var(--ink-3)}

/* svg map */
.band-bg{fill:var(--c);opacity:.05}
.band-line{stroke:var(--c);stroke-width:5;stroke-linecap:round}
.band-num{font:500 12px var(--f-mono);fill:var(--c);letter-spacing:.08em}
.band-name{font:700 19px var(--f-display);fill:var(--ink);letter-spacing:-.01em}
.band-count{font:400 11.5px var(--f-mono);fill:var(--ink-3)}
.edge{fill:none;stroke:var(--edge);stroke-width:1.15;opacity:.42;transition:opacity .25s,stroke-width .25s}
.node{cursor:pointer;transition:opacity .25s}
.node rect{fill:var(--surface);stroke:color-mix(in srgb,var(--c) 62%,var(--line));stroke-width:1.4;transition:fill .2s,stroke .2s}
.node circle{fill:var(--c)}
.node text{font:500 12.5px var(--f-body);fill:var(--ink);pointer-events:none}
.node:hover rect{stroke:var(--c);stroke-width:2}
.node:focus{outline:none}
.node:focus-visible rect{stroke:var(--focus);stroke-width:3}
#svg.focus .node{opacity:.16}
#svg.focus .node.lit{opacity:1}
#svg.focus .edge{opacity:.05}
#svg.focus .edge.lit{opacity:.95;stroke:var(--c);stroke-width:2}
.node.lit rect{stroke:var(--c);stroke-width:2}
.node.sel rect{fill:var(--c);stroke:var(--c)}
.node.sel text{fill:var(--on-c);font-weight:600}
.node.sel circle{fill:var(--on-c)}

/* tour */
.tour{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));width:min(430px,calc(100% - 24px));box-sizing:border-box;
  padding:14px 16px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);z-index:5}
.tour-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tour-step{font:500 11.5px var(--f-mono);color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}
.tour-bar{height:3px;border-radius:3px;background:var(--line);margin:10px 0 10px;overflow:hidden}
.tour-bar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.tour p{margin:0 0 12px;font-size:14.5px;line-height:1.5;text-wrap:pretty}
.tour-nav{display:flex;gap:8px;justify-content:flex-end}

/* panel */
.panel{min-height:0;overflow-y:auto;background:var(--surface);border-left:1px solid var(--line);overscroll-behavior:contain}
.pin{padding-block:22px 36px;padding-left:22px;padding-right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.pin > *{margin:0}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{display:flex;align-items:center;gap:8px;margin:0;font:500 11.5px var(--f-mono);color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}
.pin h2{font:700 27px/1.12 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.pin h3{margin-top:6px;font:600 11.5px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.lede{font-size:16px;line-height:1.5;color:var(--ink);font-weight:500;text-wrap:pretty}
.body{color:var(--ink-2);text-wrap:pretty}
.formula{margin:0;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);overflow:hidden}
.formula figcaption{padding:7px 12px 0;font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.formula code{display:block;padding:6px 12px 11px;font:400 13.5px/1.55 var(--f-mono);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.cta-row{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.nchip{display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);
  font:500 13px var(--f-body);cursor:pointer;text-align:left}
.nchip:hover{border-color:var(--c);background:var(--surface-2)}
.none{color:var(--ink-3);font-size:13px}
.path{border:1px solid var(--line);border-radius:12px;padding:12px 12px 8px;background:var(--surface-2)}
.path h3{margin:0 0 6px}
.path ol{margin:0;padding:0;list-style:none;counter-reset:p}
.path li{counter-increment:p}
.path li button{width:100%;display:flex;align-items:center;gap:9px;padding:5px 6px;border:0;border-radius:7px;background:none;cursor:pointer;text-align:left;font-size:13px}
.path li button::before{content:counter(p);min-width:22px;font:500 11px var(--f-mono);color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.path li button:hover{background:var(--surface)}
.path li.me button{font-weight:600}
.stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.stages button{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 8px;border:0;border-radius:9px;background:none;cursor:pointer;text-align:left}
.stages button:hover{background:var(--surface-2)}
.snum{font:500 12px var(--f-mono);color:var(--c);padding-top:2px}
.sname{display:block;font-weight:600;font-size:14px}
.sblurb{display:block;color:var(--ink-2);font-size:12.5px;line-height:1.4}
.scount{font:400 11.5px var(--f-mono);color:var(--ink-3);padding-top:3px;font-variant-numeric:tabular-nums}
.tip{color:var(--ink-2);font-size:13px;border-top:1px solid var(--line);padding-top:14px}

@media (max-width:1080px){ .stage{grid-template-columns:minmax(0,1fr) 340px} }
@media (max-width:820px){
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,44%)}
  .panel{border-left:0;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.06)}
  .search{flex:1 1 100%;order:3}
  .brand h1{font-size:20px}
  .hint{display:none}
  .pin{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
  .pin h2{font-size:23px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Machine Learning Atlas</h1>
      <p id="stat">From the math underneath to the models in production</p>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q" type="search" placeholder="Search concepts, e.g. attention" autocomplete="off" spellcheck="false" aria-label="Search concepts" aria-controls="results">
      <ul id="results" class="results" role="listbox" hidden></ul>
    </div>
    <button id="tourBtn" class="btn primary" type="button">Take the tour</button>
  </header>
  <nav class="rail" id="rail" aria-label="Stages"></nav>
  <main class="stage">
    <section class="map" id="map" aria-label="Concept map">
      <svg id="svg" role="img" aria-label="Graph of machine learning concepts and their prerequisites"></svg>
      <div class="tour" id="tour" hidden>
        <div class="tour-head"><span class="tour-step" id="tourStep"></span><button class="iconbtn" id="tourEnd" type="button" aria-label="End tour">×</button></div>
        <div class="tour-bar"><i id="tourBar"></i></div>
        <p id="tourText"></p>
        <div class="tour-nav"><button class="btn" id="tourPrev" type="button">Back</button><button class="btn primary" id="tourNext" type="button">Next</button></div>
      </div>
      <p class="hint">Scroll to pan · Ctrl + scroll or pinch to zoom · Click a concept</p>
      <div class="zoomctl">
        <button id="zin" type="button" aria-label="Zoom in">+</button>
        <button id="zout" type="button" aria-label="Zoom out">−</button>
        <button id="zfit" class="fit" type="button" aria-label="Show the whole map">ALL</button>
      </div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(function(){
"use strict";

/* ───────────── Content ───────────── */
const DOMAINS = [
  {id:"math",    name:"Mathematical Foundations", short:"Math", lines:["Mathematical","Foundations"], blurb:"The language every model is written in."},
  {id:"core",    name:"Learning Theory", short:"Learning Theory", lines:["Learning","Theory"], blurb:"What it means to learn from data, and how to tell whether it worked."},
  {id:"classic", name:"Classical ML", short:"Classical ML", lines:["Classical","ML"], blurb:"Pre-deep-learning models that still win on many real problems."},
  {id:"nn",      name:"Neural Networks", short:"Neural Nets", lines:["Neural","Networks"], blurb:"Neurons, gradients and the tricks that make deep nets trainable."},
  {id:"arch",    name:"Architectures", short:"Architectures", lines:["Architectures"], blurb:"From convolution and recurrence to attention and the Transformer."},
  {id:"gen",     name:"Generative Models", short:"Generative", lines:["Generative","Models"], blurb:"Models that create images, audio and other data."},
  {id:"pre",     name:"Pretraining & Scale", short:"Pretraining", lines:["Pretraining","& Scale"], blurb:"Turning internet-scale data and compute into a foundation model."},
  {id:"post",    name:"Post-training", short:"Post-training", lines:["Post-training"], blurb:"Turning a raw base model into a helpful, honest, safe assistant."},
  {id:"deploy",  name:"Deployment & Evaluation", short:"Deployment", lines:["Deployment","& Evaluation"], blurb:"Running, prompting, measuring and understanding models in the real world."}
];

const NODES = [
/* Math */
{id:"linalg",d:"math",t:"Linear Algebra",s:"Vectors, matrices and the operations that move data through every model.",
 b:"Data points are vectors and a neural network layer is a matrix multiplication. Dot products measure similarity, eigendecomposition and SVD reveal structure, and nearly all GPU work is batched matrix multiplication.",f:"y = Wx + b",r:[]},
{id:"calculus",d:"math",t:"Calculus",s:"Derivatives tell you how changing a parameter changes the output.",
 b:"Training nudges parameters to reduce error, and the gradient says which way to nudge. The chain rule, which composes derivatives of nested functions, is the mathematical core of backpropagation.",f:"∂L/∂w = ∂L/∂y · ∂y/∂w",r:[]},
{id:"prob",d:"math",t:"Probability",s:"The language of uncertainty: random variables, distributions and expectations.",
 b:"Models output probabilities, data is treated as samples from an unknown distribution, and most losses are negative log-probabilities. Conditional probability and Bayes’ rule appear everywhere from spam filters to language models.",f:"P(A|B) = P(B|A) · P(A) / P(B)",r:[]},
{id:"stats",d:"math",t:"Statistics",s:"Estimating unknown quantities from samples and judging how reliable those estimates are.",
 b:"Estimators, confidence intervals, hypothesis tests and sampling variability. Statistics is how you decide whether model A really beats model B or just got lucky on the test set.",f:"Var(x̄) = σ² / n",r:["prob"]},
{id:"optim",d:"math",t:"Optimization",s:"Finding the parameters that minimize a function.",
 b:"Learning is framed as minimizing a loss. Convexity, saddle points, step sizes and constraints all come from optimization theory. Deep learning relies on first-order methods because second-order ones are too expensive at scale.",f:"θ* = argmin_θ L(θ)",r:["calculus","linalg"]},
{id:"info",d:"math",t:"Information Theory",s:"Entropy, cross-entropy and KL divergence: measuring surprise and the gap between distributions.",
 b:"Cross-entropy is the standard loss for classification and language modeling. KL divergence measures how far one distribution is from another; it appears in VAEs, in distillation, and as the leash that keeps RLHF policies close to the original model.",f:"H(p, q) = −Σ p(x) log q(x)",r:["prob"]},

/* Learning theory */
{id:"supervised",d:"core",t:"Supervised Learning",s:"Learn a mapping from inputs to labeled outputs.",
 b:"You have pairs (x, y) and want a function that predicts y for new x. Regression predicts numbers; classification predicts categories. Most applied ML, and the fine-tuning stage of LLMs, is supervised.",f:"f : X → Y, learned from {(xᵢ, yᵢ)}",r:["prob"]},
{id:"unsupervised",d:"core",t:"Unsupervised Learning",s:"Find structure in data that has no labels.",
 b:"Clustering, dimensionality reduction and density estimation look for patterns without a teacher. Self-supervised learning, the engine of modern pretraining, grew from this idea by inventing labels from the data itself.",r:["prob"]},
{id:"rl",d:"core",t:"Reinforcement Learning",s:"An agent learns by acting in an environment and receiving rewards.",
 b:"Instead of correct answers the learner gets a scalar reward and must discover good behavior by trial and error. Key ideas are policies, value functions, exploration versus exploitation, and policy gradients. RL is the basis of RLHF and of reasoning-model training.",f:"maximize  E[ Σₜ γᵗ rₜ ]",r:["prob","optim"]},
{id:"mle",d:"core",t:"Maximum Likelihood",s:"Choose the parameters that make the observed data most probable.",
 b:"Most losses are likelihoods in disguise: squared error assumes Gaussian noise, cross-entropy assumes a categorical distribution. Training a language model with next-token cross-entropy is maximum likelihood estimation over text.",f:"θ̂ = argmax_θ Σᵢ log p(xᵢ | θ)",r:["prob","stats"]},
{id:"loss",d:"core",t:"Loss Functions",s:"A single number that scores how wrong the model is.",
 b:"Mean squared error for regression, cross-entropy for classification, hinge loss for SVMs. The loss defines what “good” means, and the model will optimize exactly that, blind spots included.",f:"MSE = (1/n) Σ (yᵢ − ŷᵢ)²",r:["supervised","info"]},
{id:"bayes",d:"core",t:"Bayesian Inference",s:"Treat parameters as uncertain and update beliefs as data arrives.",
 b:"Instead of one best parameter value, Bayesian methods keep a posterior distribution. Priors act as regularizers (an L2 penalty is a Gaussian prior), and the framework gives principled uncertainty estimates.",f:"p(θ | D) ∝ p(D | θ) · p(θ)",r:["prob","mle"]},
{id:"features",d:"core",t:"Features & Representations",s:"How raw data becomes numbers a model can use.",
 b:"Classical ML relies on hand-engineered features. Deep learning’s big shift was learning representations automatically, so useful features emerge inside the network’s hidden layers.",r:["linalg","supervised"]},
{id:"gd",d:"core",t:"Gradient Descent",s:"Repeatedly step the parameters against the gradient of the loss.",
 b:"The workhorse of all neural network training. The learning rate sets the step size: too large and training diverges, too small and it crawls. Stochastic variants estimate the gradient from a small batch of examples.",f:"θ ← θ − η ∇L(θ)",r:["optim","loss"]},
{id:"erm",d:"core",t:"Generalization",s:"Doing well on new data, not only on the training set.",
 b:"The real goal is low error on unseen data. We minimize training error as a proxy and measure generalization on held-out data. The gap between the two is the central problem of machine learning.",r:["loss","stats"]},
{id:"biasvar",d:"core",t:"Bias–Variance Tradeoff",s:"Simple models underfit; flexible models overfit.",
 b:"Error splits into bias (wrong assumptions), variance (sensitivity to the particular sample) and noise. Classical theory predicts a sweet spot of model complexity. Huge overparameterized networks complicate the picture with “double descent”.",f:"Error = Bias² + Variance + Noise",r:["erm"]},
{id:"cv",d:"core",t:"Cross-Validation",T:"Validation & Cross-Validation",s:"Hold data out to estimate performance honestly.",
 b:"Split data into train, validation and test sets. Tune hyperparameters on validation and report on test once. k-fold cross-validation rotates the held-out part so small datasets go further. Leakage between splits is one of the most common bugs in ML.",r:["erm"]},
{id:"reg",d:"core",t:"Regularization",s:"Techniques that discourage overfitting.",
 b:"Penalize large weights (L1, L2 or weight decay), stop training early, add noise, or augment the data. Each method trades a little training fit for better generalization.",f:"L′ = L + λ‖θ‖²",r:["biasvar"]},

/* Classical ML */
{id:"linreg",d:"classic",t:"Linear Regression",s:"Fit a line or hyperplane to predict a number.",
 b:"The simplest model: the prediction is a weighted sum of the inputs. It has a closed-form solution, and it is the building block of an artificial neuron.",f:"ŷ = wᵀx + b",r:["supervised","loss","linalg"]},
{id:"knn",d:"classic",t:"k-Nearest Neighbors",s:"Predict by looking at the k most similar training examples.",
 b:"There is no training step: store the data and let the nearest neighbors vote at query time. Its descendant, nearest-neighbor search over embeddings, powers modern semantic search and RAG.",r:["supervised","linalg"]},
{id:"naivebayes",d:"classic",t:"Naive Bayes",s:"Classify with Bayes’ rule, assuming features are independent.",
 b:"Fast, simple and surprisingly strong for text classification such as spam filtering. A classic example of a generative classifier.",f:"P(y | x) ∝ P(y) Πⱼ P(xⱼ | y)",r:["prob","supervised"]},
{id:"trees",d:"classic",t:"Decision Trees",s:"A flowchart of if-then splits learned from data.",
 b:"Each split is chosen to maximize information gain or reduce Gini impurity. Trees are easy to interpret and handle mixed data types, but a single tree overfits easily.",r:["supervised","info"]},
{id:"kmeans",d:"classic",t:"k-Means Clustering",s:"Group points around k centroids.",
 b:"Alternate between assigning each point to its nearest centroid and moving each centroid to the mean of its points. Simple, widely used, and a special case of the EM algorithm.",r:["unsupervised","linalg"]},
{id:"pca",d:"classic",t:"Dimensionality Reduction",T:"PCA & Dimensionality Reduction",s:"Project data onto the few directions that matter most.",
 b:"PCA uses the top eigenvectors of the covariance matrix to compress data with minimal information loss. t-SNE and UMAP are nonlinear cousins, often used to visualize embeddings.",r:["linalg","unsupervised"]},
{id:"logreg",d:"classic",t:"Logistic Regression",s:"A linear model squashed into a probability, for classification.",
 b:"Apply a sigmoid to a linear score to get P(y = 1 | x), and train with cross-entropy. A single neuron with a sigmoid activation is exactly logistic regression; softmax regression extends it to many classes.",f:"P(y=1 | x) = σ(wᵀx + b)",r:["linreg","mle"]},
{id:"svm",d:"classic",t:"Support Vector Machines",s:"Find the boundary with the widest margin between classes.",
 b:"SVMs maximize the distance to the nearest training points. The kernel trick lets them draw curved boundaries by computing dot products in a high-dimensional feature space without ever building it.",f:"min ½‖w‖²  s.t.  yᵢ(wᵀxᵢ + b) ≥ 1",r:["linreg","optim"]},
{id:"ensembles",d:"classic",t:"Random Forests & Boosting",s:"Combine many weak models into a strong one.",
 b:"Random forests average many decorrelated trees to cut variance. Gradient boosting (XGBoost, LightGBM) adds trees one at a time, each correcting the previous errors. On tabular data they often still beat deep learning.",r:["trees","biasvar"]},
{id:"gmm",d:"classic",t:"Mixture Models & EM",s:"Model data as a blend of simple distributions with hidden assignments.",
 b:"A Gaussian mixture assumes each point came from one of several Gaussians. Expectation–Maximization alternates between guessing the hidden assignments and refitting the parameters. The same latent-variable idea leads to VAEs.",r:["kmeans","mle"]},

/* Neural networks */
{id:"perceptron",d:"nn",t:"Perceptron & Neuron",s:"A weighted sum followed by a nonlinearity.",
 b:"An artificial neuron multiplies its inputs by weights, adds a bias and applies an activation. Rosenblatt’s 1958 perceptron could only learn linearly separable problems, which motivated stacking neurons into layers.",f:"a = φ(wᵀx + b)",r:["linreg","logreg"]},
{id:"activations",d:"nn",t:"Activation Functions",s:"The nonlinearities that let networks model curves, not only lines.",
 b:"Without them any stack of layers collapses into one linear map. Sigmoid and tanh came first, ReLU made deep networks practical, and GELU and SwiGLU are standard in modern Transformers.",f:"ReLU(x) = max(0, x)",r:["perceptron","calculus"]},
{id:"mlp",d:"nn",t:"Multilayer Perceptron",s:"Stacked layers of neurons: the basic deep network.",
 b:"Hidden layers transform the input step by step into a representation where the task becomes easy. One wide enough hidden layer can approximate any continuous function; depth makes it efficient. Every Transformer block contains an MLP.",f:"h = φ(W₂ φ(W₁x))",r:["perceptron","activations"]},
{id:"backprop",d:"nn",t:"Backpropagation",s:"Compute the gradient for every weight in one backward pass.",
 b:"Apply the chain rule from the loss back through each layer, reusing intermediate results. Frameworks such as PyTorch and JAX do this automatically (autodiff), so you only write the forward computation.",f:"δˡ = (Wˡ⁺¹)ᵀ δˡ⁺¹ ⊙ φ′(zˡ)",r:["mlp","calculus","gd"]},
{id:"softmaxce",d:"nn",t:"Softmax & Cross-Entropy",s:"Turn raw scores into a probability distribution and score it against the target.",
 b:"Softmax exponentiates and normalizes the logits; cross-entropy penalizes low probability on the correct class. This pair is the output layer of nearly every classifier and every language model.",f:"softmax(z)ᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)",r:["mlp","info"]},
{id:"init",d:"nn",t:"Weight Initialization",s:"Start weights at a scale where signals neither vanish nor explode.",
 b:"Xavier/Glorot and He initialization set weight variance from the layer width so activations keep a stable size through deep stacks. A bad initialization can make a network untrainable from step one.",f:"W ~ N(0, 2 / n_in)",r:["mlp"]},
{id:"dropout",d:"nn",t:"Dropout",s:"Randomly switch off neurons during training.",
 b:"Forces the network not to depend on any single unit, a bit like training an ensemble of thinner networks. Common in older and smaller models; large LLM pretraining runs often use little or none because each example is seen only about once.",r:["mlp","reg"]},
{id:"embeddings",d:"nn",t:"Embeddings",s:"Dense learned vectors for discrete things such as words or products.",
 b:"A lookup table maps each token ID to a vector, and similar items end up close together. word2vec showed embeddings capture meaning (king − man + woman ≈ queen). They are the input layer of every language model and the basis of semantic search.",f:"e = E[token_id]",r:["mlp","features"]},
{id:"sgd",d:"nn",t:"SGD & Mini-batches",s:"Estimate the gradient from a small random batch instead of the whole dataset.",
 b:"Mini-batch stochastic gradient descent is cheap per step, and its noise can even help escape poor regions. Batch size, learning rate and the learning-rate schedule are the most important training hyperparameters.",r:["backprop"]},
{id:"vanishing",d:"nn",t:"Vanishing Gradients",T:"Vanishing & Exploding Gradients",s:"Gradients shrink or blow up as they pass back through many layers.",
 b:"Multiplying many small or large Jacobians leaves early layers learning nothing, or learning chaotically. This problem shaped deep learning’s design: ReLU, careful initialization, normalization, residual connections, LSTMs and gradient clipping all address it.",r:["backprop"]},
{id:"adam",d:"nn",t:"Adam & AdamW",T:"Adam & Adaptive Optimizers",s:"Per-parameter step sizes from running statistics of the gradient.",
 b:"Adam keeps moving averages of the gradient (momentum) and of its square to scale each step. AdamW, which decouples weight decay, is the default optimizer for Transformers, usually with learning-rate warmup and cosine decay.",f:"θ ← θ − η · m̂ / (√v̂ + ε)",r:["sgd"]},
{id:"norm",d:"nn",t:"Normalization Layers",s:"Rescale activations to keep training stable.",
 b:"BatchNorm normalizes across the batch and made very deep CNNs trainable. LayerNorm and RMSNorm normalize across the features of a single example and are used in Transformers.",f:"x̂ = γ · (x − μ) / σ + β",r:["vanishing"]},
{id:"residual",d:"nn",t:"Residual Connections",s:"Add a layer’s input to its output so information has a shortcut.",
 b:"Introduced with ResNet in 2015, skip connections let gradients flow directly through hundreds of layers. Every Transformer block wraps attention and its MLP in residual connections, forming the “residual stream”.",f:"y = x + F(x)",r:["vanishing"]},

/* Architectures */
{id:"cnn",d:"arch",t:"Convolutional Networks",s:"Slide small learned filters over an image to detect local patterns.",
 b:"Weight sharing and locality make CNNs efficient for images. Early layers detect edges, later ones textures, parts and objects. AlexNet’s 2012 ImageNet win started the deep learning boom.",r:["mlp","backprop"]},
{id:"rnn",d:"arch",t:"Recurrent Networks",s:"Read a sequence one step at a time, carrying a hidden state.",
 b:"The hidden state acts as memory of what came before. Training uses backpropagation through time, which suffers badly from vanishing gradients on long sequences.",f:"hₜ = tanh(W hₜ₋₁ + U xₜ)",r:["mlp","backprop"]},
{id:"tokenization",d:"arch",t:"Tokenization",s:"Split text into the units a model reads.",
 b:"Modern models use subword schemes such as BPE: common words become one token and rare words split into pieces. Tokenization explains many LLM quirks, such as trouble counting letters in a word.",r:["embeddings"]},
{id:"gnn",d:"arch",t:"Graph Neural Networks",s:"Learn on graphs by passing messages between connected nodes.",
 b:"Each node updates its representation from its neighbors. Used for molecules, social networks, recommendation and physics simulation. A Transformer can be seen as a GNN on a fully connected graph.",r:["mlp","linalg"]},
{id:"lstm",d:"arch",t:"LSTM & GRU",s:"Recurrent cells with gates that decide what to remember and forget.",
 b:"Gates control the flow of information through a cell state, so gradients survive across long spans. LSTMs dominated speech recognition, translation and text from about 2014 to 2017.",r:["rnn","vanishing"]},
{id:"seq2seq",d:"arch",t:"Seq2Seq",T:"Encoder–Decoder (Seq2Seq)",s:"Encode an input sequence, then decode an output sequence.",
 b:"Built for machine translation: one network reads the source sentence and another writes the target. Squeezing the whole input into one fixed vector was a bottleneck, and attention was invented to remove it.",r:["lstm","embeddings"]},
{id:"attention",d:"arch",t:"Attention",s:"Let each position look directly at the most relevant other positions.",
 b:"Compare a query with a set of keys, softmax the scores, and take a weighted sum of the values. First added to seq2seq translation in 2014, attention is a soft, differentiable lookup that later became the core of the Transformer.",f:"Attn(Q, K, V) = softmax(QKᵀ / √d) · V",r:["seq2seq","softmaxce"]},
{id:"posenc",d:"arch",t:"Positional Encoding",s:"Tell the model where each token sits in the sequence.",
 b:"Attention on its own ignores order. Sinusoidal and learned position embeddings came first; rotary embeddings (RoPE) are now standard and make context windows easier to extend.",r:["attention"]},
{id:"transformer",d:"arch",t:"Transformer",s:"Self-attention plus MLPs, stacked with residual connections and normalization.",
 b:"Introduced in “Attention Is All You Need” (2017). In each block every token attends to every other token, then an MLP processes each token. It parallelizes well on GPUs, which made scaling to billions of parameters practical. It underlies essentially every large language model.",f:"x ← x + Attn(Norm(x))\nx ← x + MLP(Norm(x))",r:["attention","posenc","residual","norm","tokenization"]},
{id:"encoder",d:"arch",t:"Encoder-only (BERT)",s:"Transformers that read the whole input in both directions at once.",
 b:"Every token sees context on both sides, which suits understanding tasks such as classification, search and entity extraction. BERT (2018) is still widely used for embeddings and retrieval.",r:["transformer"]},
{id:"decoder",d:"arch",t:"Decoder-only (GPT)",s:"Causal Transformers that predict the next token.",
 b:"A causal mask stops each token from seeing later tokens, so the model can generate text left to right. This simple design, scaled up, became GPT, Claude, Llama and most modern LLMs.",r:["transformer"]},
{id:"moe",d:"arch",t:"Mixture of Experts",s:"Route each token to a few of many expert sub-networks.",
 b:"A router sends each token to, say, 2 of 64 expert MLPs, so total parameters grow while compute per token stays modest. Many frontier models use sparse MoE layers.",r:["transformer"]},
{id:"vit",d:"arch",t:"Vision Transformer",s:"Treat an image as a sequence of patches and apply a Transformer.",
 b:"ViT (2020) cut images into 16×16 patches, embedded each like a token, and matched or beat CNNs given enough data. The vision encoders inside multimodal models are usually ViTs.",r:["transformer","cnn"]},
{id:"ssm",d:"arch",t:"State Space Models",s:"Sequence models with linear cost in length, such as Mamba.",
 b:"Attention cost grows with the square of sequence length. SSMs carry a recurrent state that can also be computed in parallel during training, so cost grows linearly. Hybrids mixing SSM and attention layers are an active research area.",r:["rnn","transformer"]},

/* Generative */
{id:"autoencoder",d:"gen",t:"Autoencoders",s:"Compress the input to a small code, then reconstruct it.",
 b:"The bottleneck forces the network to keep only the essential structure of the data. Used for compression, denoising and anomaly detection. Sparse autoencoders are now a key tool in interpretability research.",r:["mlp","unsupervised"]},
{id:"gan",d:"gen",t:"GANs",T:"Generative Adversarial Networks",s:"A generator and a discriminator trained against each other.",
 b:"The generator tries to fool the discriminator and the discriminator tries to catch fakes. GANs produced the first photorealistic generated faces but are unstable to train, and diffusion models have largely replaced them.",f:"min_G max_D  E[log D(x)] + E[log(1 − D(G(z)))]",r:["mlp","backprop"]},
{id:"vae",d:"gen",t:"Variational Autoencoders",s:"Autoencoders with a probabilistic latent space you can sample from.",
 b:"The encoder outputs a distribution, and a KL term keeps it close to a simple prior so random samples decode into realistic data. Latent diffusion models such as Stable Diffusion use a VAE to compress images first.",f:"ELBO = E[log p(x|z)] − KL(q(z|x) ‖ p(z))",r:["autoencoder","bayes","info"]},
{id:"diffusion",d:"gen",t:"Diffusion Models",s:"Learn to reverse a gradual noising process.",
 b:"Add noise to data step by step until it is pure static, then train a network to predict and remove the noise. Generation starts from random noise and denoises repeatedly. This powers most modern image and video generators.",f:"L = ‖ε − ε_θ(x_t, t)‖²",r:["autoencoder","cnn"]},

/* Pretraining */
{id:"ssl",d:"pre",t:"Self-Supervised Learning",s:"Create training labels from the data itself.",
 b:"Hide part of the input and predict it: the next word, a masked word, a missing image patch. This made it possible to train on internet-scale unlabeled data, and it is how every foundation model is pretrained.",r:["unsupervised","supervised"]},
{id:"transfer",d:"pre",t:"Transfer Learning",s:"Reuse a model trained on one task as the starting point for another.",
 b:"Pretrain on ImageNet, fine-tune on chest X-rays. Scaled up, this idea is the whole foundation-model paradigm: pretrain once at huge cost, then adapt cheaply many times.",r:["features","cnn"]},
{id:"distributed",d:"pre",t:"Distributed Training",s:"Split a model and its data across thousands of accelerators.",
 b:"Data parallelism copies the model and splits the batch; tensor and pipeline parallelism split the model itself; ZeRO and FSDP shard optimizer state. Frontier runs coordinate tens of thousands of GPUs or TPUs for months.",r:["adam","transformer"]},
{id:"mixedprec",d:"pre",t:"Mixed Precision",s:"Train in 16-bit or 8-bit number formats to save memory and time.",
 b:"bf16 halves memory and speeds up matrix multiplication on modern hardware, while a full-precision copy of the weights is kept where needed. FP8 training is used in some recent large runs.",r:["adam"]},
{id:"data",d:"pre",t:"Pretraining Data",s:"Collecting, filtering and mixing the text a model learns from.",
 b:"Web crawls, books, code and papers are deduplicated, filtered for quality and safety, then mixed in chosen proportions. Data quality often matters as much as architecture, and synthetic data from other models is a growing part of the mix.",r:["ssl","tokenization"]},
{id:"nexttoken",d:"pre",t:"Next-Token Prediction",s:"Pretrain a decoder to predict the next token across trillions of tokens.",
 b:"The whole objective is cross-entropy on the next token. To do it well across the internet, the model must pick up grammar, facts, reasoning patterns and code. This is the pretraining objective of GPT-style LLMs.",f:"L = −Σₜ log p(xₜ | x₍<ₜ₎)",r:["ssl","decoder","softmaxce","mle"]},
{id:"mlm",d:"pre",t:"Masked Language Modeling",s:"Hide random tokens and predict them from both sides.",
 b:"BERT’s objective: mask about 15% of tokens and reconstruct them. Excellent for learning representations, but less natural for generating text.",r:["ssl","encoder"]},
{id:"contrastive",d:"pre",t:"Contrastive Learning & CLIP",s:"Pull matching pairs together and push others apart in embedding space.",
 b:"CLIP trained on 400 million image–caption pairs so each image lands near its caption. The result is zero-shot image classification and a text–image bridge used by many multimodal and generative models.",r:["ssl","embeddings","vit"]},
{id:"scaling",d:"pre",t:"Scaling Laws",s:"Loss falls as a predictable power law in model size, data and compute.",
 b:"Kaplan et al. (2020) and Chinchilla (2022) showed you can forecast performance before training and choose how to split compute between parameters and tokens. Chinchilla’s rule of thumb is about 20 training tokens per parameter.",f:"L(N, D) ≈ E + A / N^α + B / D^β",r:["nexttoken","data"]},
{id:"foundation",d:"pre",t:"Foundation Model",T:"Base / Foundation Model",s:"One large pretrained model that can be adapted to many tasks.",
 b:"The output of pretraining: a base model that has absorbed broad knowledge but only continues text. It is not yet a helpful assistant; post-training turns it into one.",r:["nexttoken","scaling","distributed","transfer"]},
{id:"icl",d:"pre",t:"In-Context Learning",s:"Learning a task from examples in the prompt, with no weight updates.",
 b:"GPT-3 (2020) showed that large models can translate or do arithmetic from a few examples placed in the prompt. Few-shot prompting and chain-of-thought both build on this ability.",r:["foundation"]},
{id:"longctx",d:"pre",t:"Long Context",s:"Extending how many tokens a model can attend to at once.",
 b:"RoPE scaling, efficient attention kernels such as FlashAttention, and continued training on long documents push context windows from a few thousand to a million or more tokens, enough for whole codebases or books.",r:["foundation","posenc"]},
{id:"multimodal",d:"pre",t:"Multimodal Models",s:"One model that reads text, images, audio and more.",
 b:"A vision encoder turns images into token-like embeddings that the language model attends to alongside text. Frontier models now accept images, documents and audio natively.",r:["contrastive","foundation","vit"]},

/* Post-training */
{id:"sft",d:"post",t:"Supervised Fine-Tuning",T:"Supervised Fine-Tuning (SFT)",s:"Train the base model on example conversations that show ideal behavior.",
 b:"Also called instruction tuning. High-quality prompt–response pairs teach the assistant format: follow instructions, answer helpfully, decline harmful requests. It is the first step from base model to assistant.",r:["foundation","supervised"]},
{id:"peft",d:"post",t:"LoRA & PEFT",T:"LoRA & Parameter-Efficient Fine-Tuning",s:"Fine-tune by training small add-on matrices instead of every weight.",
 b:"LoRA freezes the original weights and learns a low-rank update, often under 1% of the parameters. This makes fine-tuning cheap enough for a single GPU; QLoRA combines it with quantization.",f:"W′ = W + BA,  rank r ≪ d",r:["sft","linalg"]},
{id:"prefdata",d:"post",t:"Human Preference Data",s:"People compare two model responses and pick the better one.",
 b:"Comparing is easier and more consistent for people than writing perfect answers. These ranked pairs are the raw material for reward models and for DPO.",r:["sft"]},
{id:"rlvr",d:"post",t:"RL with Verifiable Rewards",s:"Reward the model when its answer can be checked: tests pass, the math is right.",
 b:"No learned reward model is needed when there is ground truth. Algorithms such as GRPO compare a group of sampled answers to estimate which were better than average. This is the main recipe behind reasoning models that think before answering.",r:["rl","sft"]},
{id:"tooluse",d:"post",t:"Tool Use",T:"Tool Use & Function Calling",s:"Teach the model to call APIs, run code and search.",
 b:"The model emits a structured call, the system runs it and returns the result, and the model continues. Trained with fine-tuning on tool transcripts and with RL in interactive environments. The foundation for agents.",r:["sft"]},
{id:"distill",d:"post",t:"Knowledge Distillation",s:"Train a small student model to imitate a large teacher.",
 b:"The student learns from the teacher’s full output distribution or from its generated text, keeping much of the capability at a fraction of the cost. Many small, fast production models are distilled.",f:"L = KL(p_teacher ‖ p_student)",r:["sft","info"]},
{id:"rm",d:"post",t:"Reward Model",s:"A model trained to predict which response people prefer.",
 b:"Usually the LLM itself with a scalar output head, trained with a Bradley–Terry loss on preference pairs. It becomes an automatic judge that can score millions of responses during RL.",f:"L = −log σ( r(x, y_w) − r(x, y_l) )",r:["prefdata","logreg"]},
{id:"dpo",d:"post",t:"DPO",T:"Direct Preference Optimization (DPO)",s:"Learn from preference pairs directly, with no reward model or RL loop.",
 b:"DPO (2023) rewrites the RLHF objective as a simple classification loss on preference pairs. It is simpler and more stable than PPO and widely used for open models.",f:"L = −log σ( β·log[π(y_w)/π_ref(y_w)] − β·log[π(y_l)/π_ref(y_l)] )",r:["prefdata","info"]},
{id:"cot",d:"post",t:"Chain-of-Thought & Reasoning",s:"Models that work through intermediate steps before the final answer.",
 b:"Prompting “let’s think step by step” improved accuracy; RL on verifiable tasks then taught models to produce long, self-correcting reasoning on their own. Spending more compute at answer time (test-time compute) became a new axis of scaling.",r:["icl","rlvr"]},
{id:"rlhf",d:"post",t:"RLHF",T:"RLHF (Reinforcement Learning from Human Feedback)",s:"Optimize the model with reinforcement learning against the reward model.",
 b:"The policy writes responses, the reward model scores them, and an algorithm such as PPO updates the policy. A KL penalty keeps it close to the SFT model so it does not exploit flaws in the reward model (reward hacking). Used for InstructGPT and ChatGPT.",f:"max  E[ r(x, y) ] − β · KL(π ‖ π_ref)",r:["rm","rl","info"]},
{id:"rlaif",d:"post",t:"Constitutional AI & RLAIF",s:"Use AI feedback guided by written principles, not only human labels.",
 b:"The model critiques and revises its own outputs against a set of principles (a “constitution”), and AI-generated preference labels train the reward model. Developed by Anthropic to scale oversight and make the values behind training explicit.",r:["rlhf"]},
{id:"safety",d:"post",t:"Alignment & Safety",T:"Alignment & Safety Training",s:"Making models helpful, honest and harmless, and keeping them that way.",
 b:"Includes refusal training, honesty and calibration, resistance to jailbreaks and prompt injection, and study of failure modes such as reward hacking and sycophancy. It combines training methods, evaluations and policy.",r:["rlhf","rlaif"]},

/* Deployment & evaluation */
{id:"decoding",d:"deploy",t:"Decoding & Sampling",s:"Turn next-token probabilities into actual text.",
 b:"Greedy decoding takes the top token; temperature reshapes the distribution; top-k and top-p (nucleus) sampling trim unlikely tokens. These settings trade creativity against reliability.",f:"p(token) ∝ exp(logit / T)",r:["nexttoken"]},
{id:"kvcache",d:"deploy",t:"KV Cache",s:"Store past keys and values so each new token is cheap to compute.",
 b:"Without it, every new token recomputes attention over all earlier tokens. Caching makes generation fast but uses a lot of memory, which is why long contexts are expensive to serve. Grouped-query and paged attention shrink and manage it.",r:["decoder","attention"]},
{id:"quant",d:"deploy",t:"Quantization",s:"Store weights and activations in fewer bits.",
 b:"Moving from 16-bit to 8-bit or 4-bit numbers cuts memory and speeds up inference with little accuracy loss. Methods such as GPTQ and AWQ choose the scales carefully; this is how large models run on laptops.",r:["foundation"]},
{id:"prompting",d:"deploy",t:"Prompt Engineering",s:"Steer a model through instructions, examples and context.",
 b:"Clear instructions, a defined format, relevant examples and well-organized context. As models improve, the work shifts from tricks to clearly specifying the task, sometimes called context engineering.",r:["icl","sft"]},
{id:"evals",d:"deploy",t:"Evaluation & Benchmarks",s:"Measuring what a model can and cannot do.",
 b:"Benchmarks such as MMLU, GPQA and SWE-bench measure knowledge, reasoning and coding; human preference arenas measure how responses feel. Watch for contamination (test data leaking into training) and for benchmarks that saturate.",r:["cv","stats"]},
{id:"interp",d:"deploy",t:"Interpretability",s:"Understanding what is happening inside the network.",
 b:"Probing, attribution and mechanistic interpretability try to reverse-engineer the algorithms a model has learned. Sparse autoencoders split activations into human-readable features. The aim is to check a model’s reasoning instead of trusting its outputs alone.",r:["transformer","autoencoder"]},
{id:"specdec",d:"deploy",t:"Speculative Decoding",s:"A small model drafts tokens and the large model verifies them in one pass.",
 b:"Accepted tokens are exactly what the large model would have produced, but several arrive per step, often giving a 2–3× speedup.",r:["decoding","kvcache"]},
{id:"serving",d:"deploy",t:"Serving & Batching",s:"Running models for many users at once, quickly and cheaply.",
 b:"Continuous batching, paged KV memory (as in vLLM) and prompt caching keep accelerators busy and latency low. Cost per token is a central engineering constraint for every AI product.",r:["kvcache","quant"]},
{id:"rag",d:"deploy",t:"Retrieval (RAG)",T:"Retrieval-Augmented Generation",s:"Fetch relevant documents and put them in the prompt.",
 b:"Embed your documents, find the ones nearest to the question with vector search, and let the model answer from them. This reduces hallucination and gives access to private or fresh information without retraining.",r:["knn","embeddings","prompting"]},
{id:"redteam",d:"deploy",t:"Red Teaming",s:"Deliberately attack a model to find harmful or broken behavior.",
 b:"Human experts and automated attackers search for jailbreaks, dangerous capabilities and failure modes before release. Findings feed back into safety training and deployment safeguards.",r:["safety","evals"]},
{id:"agents",d:"deploy",t:"AI Agents",s:"Models that plan and take multi-step actions with tools.",
 b:"An agent loops: think, call a tool, read the result, repeat until the task is done. Coding agents, research agents and computer-use agents are examples. Staying reliable over long tasks is the main open challenge.",r:["tooluse","cot","rag"]}
];

const TOUR = [
 ["linalg","Every model is built from vectors and matrices. Text, images and sound all become lists of numbers."],
 ["prob","Models deal in uncertainty, so they speak probability. A language model outputs a distribution over the next token."],
 ["loss","To learn, the model needs a score for how wrong it is. That score is the loss."],
 ["gd","Gradient descent nudges every parameter slightly downhill on the loss, over and over."],
 ["mlp","Stack simple neurons with nonlinear activations and you get a network that can approximate almost any function."],
 ["backprop","Backpropagation computes the gradient for every weight in a single backward pass."],
 ["residual","Residual connections and normalization make networks hundreds of layers deep trainable."],
 ["embeddings","Words become token IDs, and each ID becomes a learned vector."],
 ["attention","Attention lets every token pull in information from the tokens most relevant to it."],
 ["transformer","The Transformer stacks attention and MLP blocks. It trains in parallel on GPUs, which made massive scale possible."],
 ["decoder","A causal mask turns it into a decoder that generates text one token at a time."],
 ["data","Pretraining starts with trillions of tokens of filtered web text, books and code."],
 ["nexttoken","The model learns by predicting the next token, again and again, across all of that data."],
 ["scaling","Scaling laws predict how much better the model gets with more parameters, data and compute."],
 ["foundation","The result is a base model. It knows a lot, but it only continues text."],
 ["sft","Fine-tuning on example conversations teaches it to act as an assistant."],
 ["rm","People compare pairs of responses, and a reward model learns to predict their preferences."],
 ["rlhf","Reinforcement learning then pushes the model toward the responses people prefer."],
 ["rlvr","RL on tasks with checkable answers, such as math and code, teaches the model to reason step by step."],
 ["safety","Safety training aims to keep the model helpful, honest and harmless."],
 ["evals","Evaluations and red teaming measure what the model can actually do before it ships."],
 ["serving","Quantization, KV caching and batching make it fast and cheap enough to serve millions of people."],
 ["agents","Give the model tools and room to reason, and it can work as an agent on multi-step tasks."]
];

/* ───────────── Graph prep ───────────── */
const D = DOMAINS; const dIdx = {};
D.forEach((d,i)=>{ d.i=i; d.c=`var(--d-${d.id})`; dIdx[d.id]=i; });
const byId = new Map(NODES.map(n=>[n.id,n]));
NODES.forEach(n=>{ n.kids=[]; n.c=`var(--d-${n.d})`; });
const EDGES=[];
NODES.forEach(n=>n.r.forEach(p=>{
  const pn=byId.get(p);
  if(!pn){ console.warn("Missing prerequisite",p,"for",n.id); return; }
  if(dIdx[pn.d]>dIdx[n.d]) console.warn("Backward edge",p,"→",n.id);
  pn.kids.push(n.id); EDGES.push({s:p,t:n.id,c:pn.c});
}));
NODES.forEach(n=>{ n.r=n.r.filter(p=>byId.has(p)); });

const depthMemo={};
function depth(n){
  if(depthMemo[n.id]!=null) return depthMemo[n.id];
  let m=0; n.r.forEach(p=>{ const pn=byId.get(p); if(pn.d===n.d) m=Math.max(m,depth(pn)+1); });
  return depthMemo[n.id]=m;
}
NODES.forEach(n=>n.depth=depth(n));

const pad = i => String(i).padStart(2,"0");
const mean = a => a.reduce((s,v)=>s+v,0)/a.length;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const DUR = reduceMotion ? 0 : 600;

document.getElementById("stat").textContent =
  `${NODES.length} concepts · ${EDGES.length} connections · ${D.length} stages, from linear algebra to AI agents`;

/* ───────────── Layout (top → bottom) ───────────── */
const RH=62, BAND_GAP=46, GUT=236, NH=28, HGAP=20, RIGHT_PAD=48;
let svg, root, zoom, nodeSel, edgeSel, W=0, H=0;

function measure(){
  const cv=document.createElement("canvas").getContext("2d");
  cv.font='500 12.5px "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif';
  NODES.forEach(n=>{ n.w=Math.ceil(cv.measureText(n.t).width)+40; });
}

function layout(){
  const rows=[]; let y=0;
  D.forEach(d=>{
    d.nodes=NODES.filter(n=>n.d===d.id);
    const maxD=Math.max(...d.nodes.map(n=>n.depth));
    d.y0=y;
    for(let k=0;k<=maxD;k++){
      const row=d.nodes.filter(n=>n.depth===k);
      row.forEach(n=>n.y=y+RH/2);
      rows.push(row); y+=RH;
    }
    d.y1=y; y+=BAND_GAP;
  });
  H=y-BAND_GAP;

  const initRow=row=>{ let x=0; row.forEach(n=>{ n.x=x+n.w/2; x+=n.w+HGAP; }); const off=(x-HGAP)/2; row.forEach(n=>n.x-=off); };
  const pack=row=>{
    row.sort((a,b)=>a.bc-b.bc);
    row.forEach((n,i)=>{ n.x = i===0 ? n.bc : Math.max(n.bc, row[i-1].x+row[i-1].w/2+HGAP+n.w/2); });
    const sh=mean(row.map(n=>n.bc))-mean(row.map(n=>n.x));
    row.forEach(n=>n.x+=sh);
  };
  rows.forEach(initRow);
  for(let it=0;it<10;it++){
    const down=it%2===0, seq=down?rows:[...rows].reverse();
    seq.forEach(row=>{
      row.forEach(n=>{
        const nb=(down?n.r:n.kids).map(id=>byId.get(id).x);
        n.bc = nb.length ? (0.75*mean(nb)+0.25*n.x) : n.x;
      });
      pack(row);
    });
  }
  rows.forEach(row=>{ row.forEach(n=>{ const nb=[...n.r,...n.kids].map(id=>byId.get(id).x); n.bc=nb.length?(0.6*mean(nb)+0.4*n.x):n.x; }); pack(row); });

  const minX=Math.min(...NODES.map(n=>n.x-n.w/2));
  NODES.forEach(n=>n.x+=GUT-minX);
  W=Math.max(...NODES.map(n=>n.x+n.w/2))+RIGHT_PAD;
}

/* ───────────── Render ───────────── */
function render(){
  svg=d3.select("#svg");
  root=svg.append("g");

  const bands=root.append("g").selectAll("g").data(D).join("g").attr("class","band").style("--c",d=>d.c);
  bands.append("rect").attr("class","band-bg").attr("x",0).attr("width",W).attr("y",d=>d.y0-14).attr("height",d=>d.y1-d.y0+28).attr("rx",18);
  bands.append("line").attr("class","band-line").attr("x1",18).attr("x2",18).attr("y1",d=>d.y0+2).attr("y2",d=>d.y1-2);
  bands.append("text").attr("class","band-num").attr("x",36).attr("y",d=>d.y0+22).text(d=>`STAGE ${pad(d.i+1)}`);
  bands.each(function(d){
    const t=d3.select(this).append("text").attr("class","band-name").attr("x",36).attr("y",d.y0+48);
    d.lines.forEach((ln,i)=>t.append("tspan").attr("x",36).attr("dy",i?23:0).text(ln));
    d3.select(this).append("text").attr("class","band-count").attr("x",36).attr("y",d.y0+48+23*(d.lines.length-1)+22).text(`${d.nodes.length} concepts`);
  });

  edgeSel=root.append("g").selectAll("path").data(EDGES).join("path")
    .attr("class","edge").style("--c",e=>e.c)
    .attr("d",e=>{
      const a=byId.get(e.s), b=byId.get(e.t);
      const sy=a.y+NH/2, ty=b.y-NH/2, dy=Math.max(26,(ty-sy)*0.5);
      return `M${a.x},${sy} C${a.x},${sy+dy} ${b.x},${ty-dy} ${b.x},${ty}`;
    });

  nodeSel=root.append("g").selectAll("g").data(NODES).join("g")
    .attr("class","node").style("--c",n=>n.c)
    .attr("transform",n=>`translate(${n.x},${n.y})`)
    .attr("tabindex",0).attr("role","button").attr("aria-label",n=>`${n.T||n.t}: ${n.s}`);
  nodeSel.append("rect").attr("x",n=>-n.w/2).attr("y",-NH/2).attr("width",n=>n.w).attr("height",NH).attr("rx",NH/2);
  nodeSel.append("circle").attr("cx",n=>-n.w/2+14).attr("cy",0).attr("r",4);
  nodeSel.append("text").attr("x",n=>-n.w/2+25).attr("y",0).attr("dy","0.35em").text(n=>n.t);

  nodeSel
    .on("click",(e,n)=>{ e.stopPropagation(); select(n.id); })
    .on("keydown",(e,n)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); select(n.id); } })
    .on("pointerenter",(e,n)=>{ if(e.pointerType==="mouse"){ hoverId=n.id; applyHighlight(); } })
    .on("pointerleave",(e,n)=>{ if(hoverId===n.id){ hoverId=null; applyHighlight(); } })
    .on("focus",(e,n)=>{ hoverId=n.id; applyHighlight(); })
    .on("blur",()=>{ hoverId=null; applyHighlight(); });

  const mapEl=document.getElementById("map");
  zoom=d3.zoom().scaleExtent([0.12,2.4])
    .translateExtent([[-700,-500],[W+700,H+500]])
    .filter(e=> e.type==="wheel" ? (e.ctrlKey||e.metaKey) : (!e.button && e.type!=="dblclick"))
    .on("zoom",e=>{
      root.attr("transform",e.transform);
      const s=24*e.transform.k;
      mapEl.style.backgroundSize=`${s}px ${s}px`;
      mapEl.style.backgroundPosition=`${e.transform.x}px ${e.transform.y}px`;
    });
  svg.call(zoom).on("dblclick.zoom",null);
  svg.on("wheel.pan",e=>{
    if(e.ctrlKey||e.metaKey) return;
    e.preventDefault();
    const k=d3.zoomTransform(svg.node()).k;
    const f=e.deltaMode===1?16:1;
    zoom.translateBy(svg,-e.deltaX*f/k,-e.deltaY*f/k);
  },{passive:false});
  svg.on("click",e=>{ if(e.target===svg.node()||e.target.classList.contains("band-bg")) clearSelection(); });

  document.getElementById("zin").onclick=()=>svg.transition().duration(DUR/2).call(zoom.scaleBy,1.35);
  document.getElementById("zout").onclick=()=>svg.transition().duration(DUR/2).call(zoom.scaleBy,1/1.35);
  document.getElementById("zfit").onclick=()=>fitAll();
}

/* ───────────── Camera ───────────── */
function view(){ const r=svg.node().getBoundingClientRect(); return {w:r.width||800,h:r.height||600}; }
function go(k,cx,cy,dur=DUR){
  const {w,h}=view();
  const t=d3.zoomIdentity.translate(w/2-k*cx,h/2-k*cy).scale(k);
  svg.transition().duration(dur).ease(d3.easeCubicInOut).call(zoom.transform,t);
}
function goTop(k,y0,dur=DUR){
  const {w}=view();
  const t=d3.zoomIdentity.translate(w/2-k*W/2,16-k*y0).scale(k);
  svg.transition().duration(dur).ease(d3.easeCubicInOut).call(zoom.transform,t);
}
function fitAll(dur=DUR){ const {w,h}=view(); const k=Math.min((w-32)/W,(h-32)/H); go(k,W/2,H/2,dur); }
function fitWidthK(){ const {w}=view(); return Math.max(0.42,Math.min(1,(w-24)/W)); }
function startView(dur=0){ goTop(fitWidthK(),D[0].y0-14,dur); }
function zoomBand(id){ const d=D[dIdx[id]]; goTop(fitWidthK(),d.y0-20); }
function focusNode(n){
  const cur=d3.zoomTransform(svg.node()).k;
  const k=Math.min(1.3,Math.max(cur,0.9));
  go(k,n.x,n.y);
}
function fitNodes(ids){
  const ns=[...ids].map(id=>byId.get(id));
  const x0=Math.min(...ns.map(n=>n.x-n.w/2)), x1=Math.max(...ns.map(n=>n.x+n.w/2));
  const y0=Math.min(...ns.map(n=>n.y-NH)), y1=Math.max(...ns.map(n=>n.y+NH));
  const {w,h}=view();
  const k=Math.max(0.15,Math.min(1.1,(w-60)/(x1-x0),(h-60)/(y1-y0)));
  go(k,(x0+x1)/2,(y0+y1)/2);
}

/* ───────────── State & highlight ───────────── */
let selId=null, hoverId=null, trace=null, tourIdx=null;

function ancestors(id){
  const s=new Set([id]), st=[id];
  while(st.length){ byId.get(st.pop()).r.forEach(p=>{ if(!s.has(p)){ s.add(p); st.push(p); } }); }
  return s;
}

function applyHighlight(){
  const lit=new Set(); let center=null;
  if(trace){ trace.forEach(i=>lit.add(i)); }
  else{
    center=hoverId||selId;
    if(center){ const n=byId.get(center); lit.add(center); n.r.forEach(i=>lit.add(i)); n.kids.forEach(i=>lit.add(i)); }
  }
  svg.classed("focus",lit.size>0);
  nodeSel.classed("lit",n=>lit.has(n.id)).classed("sel",n=>n.id===selId);
  edgeSel.classed("lit",e=> trace ? (lit.has(e.s)&&lit.has(e.t)) : (e.s===center||e.t===center));
  edgeSel.filter(".lit").raise();
}

function setHash(id){
  try{ history.replaceState(null,"",id?("#"+id):(location.pathname+location.search)); }catch(_){}
}

function select(id,opts={}){
  const n=byId.get(id); if(!n) return;
  if(!opts.fromTour && tourIdx!==null) endTour(true);
  selId=id; trace=null;
  renderNode(n);
  applyHighlight();
  if(!opts.noPan) focusNode(n);
  setHash(id);
  if(!opts.keepScroll) panel.scrollTop=0;
}
function clearSelection(){
  if(tourIdx!==null) endTour(true);
  selId=null; trace=null; hoverId=null;
  applyHighlight(); renderIntro(); setHash(null);
}
function toggleTrace(){
  if(!selId) return;
  trace = trace ? null : ancestors(selId);
  renderNode(byId.get(selId));
  applyHighlight();
  if(trace) fitNodes(trace); else focusNode(byId.get(selId));
}

/* ───────────── Panel ───────────── */
const panel=document.getElementById("panel");
const chip=n=>`<button class="nchip" type="button" data-id="${n.id}" style="--c:${n.c}"><span class="dot"></span>${esc(n.t)}</button>`;

function renderIntro(){
  panel.innerHTML=`<div class="pin">
    <p class="eyebrow">How to read the map</p>
    <h2>From linear algebra to AI agents</h2>
    <p class="lede">Each box is one concept. A line from a box above to a box below means the lower idea builds on the upper one.</p>
    <p class="body">The map runs top to bottom in nine stages. That is roughly the order the field is learned, and the order in which a modern language model is built: math, learning theory, neural networks, the Transformer, pretraining, post-training, then deployment.</p>
    <div class="cta-row"><button class="btn primary" type="button" data-act="tour">Take the ${TOUR.length}-step tour</button><button class="btn" type="button" data-act="all">See the whole map</button></div>
    <h3>The nine stages</h3>
    <ol class="stages">${D.map(d=>`<li><button type="button" data-band="${d.id}" style="--c:${d.c}"><span class="snum">${pad(d.i+1)}</span><span><span class="sname">${esc(d.name)}</span><span class="sblurb">${esc(d.blurb)}</span></span><span class="scount">${d.nodes.length}</span></button></li>`).join("")}</ol>
    <p class="tip">Open any concept and press <b>Trace prerequisites</b> to get a reading order for everything it depends on. Try it on RLHF or the Transformer.</p>
  </div>`;
}

function renderNode(n){
  const d=D[dIdx[n.d]];
  const list=ids=>ids.length?`<div class="chips">${ids.map(id=>chip(byId.get(id))).join("")}</div>`:"";
  let path="";
  if(trace){
    const ord=[...trace].map(id=>byId.get(id)).sort((a,b)=>a.y-b.y||a.x-b.x);
    path=`<div class="path"><h3>Reading order · ${ord.length} concepts</h3><ol>${ord.map(m=>`<li class="${m.id===n.id?"me":""}"><button type="button" data-id="${m.id}" style="--c:${m.c}"><span class="dot"></span>${esc(m.T||m.t)}</button></li>`).join("")}</ol></div>`;
  }
  panel.innerHTML=`<div class="pin">
    <div class="topline"><p class="eyebrow" style="--c:${d.c}"><span class="dot"></span>Stage ${pad(d.i+1)} · ${esc(d.name)}</p><button class="iconbtn" type="button" data-act="close" aria-label="Back to overview">×</button></div>
    <h2>${esc(n.T||n.t)}</h2>
    <p class="lede">${esc(n.s)}</p>
    <p class="body">${esc(n.b)}</p>
    ${n.f?`<figure class="formula"><figcaption>Key idea</figcaption><code>${esc(n.f)}</code></figure>`:""}
    ${n.r.length?`<div class="cta-row"><button class="btn ${trace?"on":""}" type="button" data-act="trace" aria-pressed="${!!trace}">${trace?"Hide prerequisites":"Trace prerequisites"}</button></div>`:""}
    ${path}
    ${n.r.length?`<h3>Builds on · ${n.r.length}</h3>${list(n.r)}`:`<h3>Builds on</h3><p class="none">Nothing on this map. This is a starting point.</p>`}
    ${n.kids.length?`<h3>Leads to · ${n.kids.length}</h3>${list(n.kids)}`:`<h3>Leads to</h3><p class="none">Nothing further on this map. This is where today’s frontier sits.</p>`}
  </div>`;
}

panel.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.id) return select(b.dataset.id);
  if(b.dataset.band) return zoomBand(b.dataset.band);
  const a=b.dataset.act;
  if(a==="trace") toggleTrace();
  else if(a==="close") clearSelection();
  else if(a==="tour") startTour();
  else if(a==="all") fitAll();
});

/* ───────────── Stage rail ───────────── */
const rail=document.getElementById("rail");
function renderRail(){
  rail.innerHTML=D.map(d=>`<button class="chip" type="button" data-band="${d.id}" style="--c:${d.c}"><span class="dot"></span><span class="num">${pad(d.i+1)}</span>${esc(d.short)}</button>`).join("");
  rail.addEventListener("click",e=>{ const b=e.target.closest("[data-band]"); if(b) zoomBand(b.dataset.band); });
}

/* ───────────── Tour ───────────── */
const tourEl=document.getElementById("tour");
function startTour(){ tourIdx=0; tourEl.hidden=false; showStep(); }
function showStep(){
  const [id,text]=TOUR[tourIdx];
  document.getElementById("tourStep").textContent=`Tour · step ${tourIdx+1} of ${TOUR.length}`;
  document.getElementById("tourText").textContent=text;
  document.getElementById("tourBar").style.width=`${(tourIdx+1)/TOUR.length*100}%`;
  document.getElementById("tourPrev").disabled=tourIdx===0;
  document.getElementById("tourNext").textContent=tourIdx===TOUR.length-1?"Finish":"Next";
  select(id,{fromTour:true});
}
function endTour(silent){ tourIdx=null; tourEl.hidden=true; if(!silent){} }
document.getElementById("tourBtn").onclick=startTour;
document.getElementById("tourPrev").onclick=()=>{ if(tourIdx>0){ tourIdx--; showStep(); } };
document.getElementById("tourNext").onclick=()=>{ if(tourIdx<TOUR.length-1){ tourIdx++; showStep(); } else { endTour(); fitAll(); } };
document.getElementById("tourEnd").onclick=()=>endTour();

/* ───────────── Search ───────────── */
const q=document.getElementById("q"), res=document.getElementById("results");
let hits=[], hi=0;
function runSearch(){
  const s=q.value.trim().toLowerCase();
  if(!s){ res.hidden=true; return; }
  hits=NODES.map(n=>{
    const t=(n.t+" "+(n.T||"")).toLowerCase();
    let score=0;
    if(t.startsWith(s)) score=3; else if(t.includes(s)) score=2; else if((n.s+" "+n.b).toLowerCase().includes(s)) score=1;
    return {n,score};
  }).filter(h=>h.score).sort((a,b)=>b.score-a.score||a.n.y-b.n.y).slice(0,8).map(h=>h.n);
  hi=0;
  res.innerHTML = hits.length
    ? hits.map((n,i)=>`<li><button type="button" role="option" data-id="${n.id}" aria-selected="${i===hi}" style="--c:${n.c}"><span class="dot"></span><span><span class="rt">${esc(n.T||n.t)}</span><span class="rs">${esc(n.s)}</span></span></button></li>`).join("")
    : `<li class="empty">No concept matches “${esc(q.value.trim())}”.</li>`;
  res.hidden=false;
}
function markHi(){ res.querySelectorAll("button").forEach((b,i)=>b.setAttribute("aria-selected",i===hi)); }
function pick(id){ res.hidden=true; q.value=""; q.blur(); select(id); }
q.addEventListener("input",runSearch);
q.addEventListener("focus",runSearch);
q.addEventListener("keydown",e=>{
  if(res.hidden||!hits.length){ if(e.key==="Escape") q.blur(); return; }
  if(e.key==="ArrowDown"){ e.preventDefault(); hi=(hi+1)%hits.length; markHi(); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); hi=(hi-1+hits.length)%hits.length; markHi(); }
  else if(e.key==="Enter"){ e.preventDefault(); pick(hits[hi].id); }
  else if(e.key==="Escape"){ res.hidden=true; }
});
res.addEventListener("mousedown",e=>{ const b=e.target.closest("[data-id]"); if(b){ e.preventDefault(); pick(b.dataset.id); } });
document.addEventListener("click",e=>{ if(!e.target.closest(".search")) res.hidden=true; });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && document.activeElement!==q){ if(tourIdx!==null) endTour(); else if(selId) clearSelection(); }
  if(e.key==="/" && document.activeElement!==q && !e.target.closest("input")){ e.preventDefault(); q.focus(); }
});

/* ───────────── Boot ───────────── */
function fromHash(){
  const id=decodeURIComponent((location.hash||"").slice(1));
  if(id && byId.has(id)){ select(id); return true; }
  return false;
}
function boot(){
  measure(); layout(); render(); renderRail(); renderIntro();
  startView(0);
  if(!fromHash()) applyHighlight();
  window.addEventListener("hashchange",()=>{ fromHash(); });
}
const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
Promise.race([fontsReady, new Promise(r=>setTimeout(r,1500))]).then(boot, boot);
})();
</script>

</body>
